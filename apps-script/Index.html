<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presensi Jonas Photo</title>
  <base target="_top">
  <style>
    :root {
      color-scheme: light dark;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --bg: #ffffff;
      --surface: #f4f4f5;
      --text: #09090b;
      --muted: #52525b;
      --field: #ffffff;
      --border: #8b8b93;
      --masuk: #15803d;
      --masuk-hover: #166534;
      --on-masuk: #ffffff;
      --pulang: #18181b;
      --pulang-hover: #3f3f46;
      --on-pulang: #ffffff;
      --ring: #2563eb;
      --ok-bg: #dcfce7;
      --ok-text: #14532d;
      --err-bg: #fee2e2;
      --err-text: #7f1d1d;
      --info-bg: #e4e4e7;
      --info-text: #18181b;
      --radius: 10px;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --surface: #18181b;
        --text: #fafafa;
        --muted: #a1a1aa;
        --field: #09090b;
        --border: #71717a;
        --masuk: #22c55e;
        --masuk-hover: #4ade80;
        --on-masuk: #052e16;
        --pulang: #fafafa;
        --pulang-hover: #d4d4d8;
        --on-pulang: #09090b;
        --ring: #60a5fa;
        --ok-bg: #052e16;
        --ok-text: #86efac;
        --err-bg: #450a0a;
        --err-text: #fca5a5;
        --info-bg: #27272a;
        --info-text: #e4e4e7;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 20px;
      background: var(--bg);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo {
      width: 160px;
      height: auto;
      display: block;
      margin: 0 auto 16px;
      mix-blend-mode: multiply; /* latar PNG putih solid; lebur ke latar kartu */
    }
    @media (prefers-color-scheme: dark) {
      .logo { filter: invert(1); mix-blend-mode: screen; }
    }
    .date {
      font-size: 14px;
      color: var(--muted);
    }
    .clock {
      margin-top: 2px;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .tz {
      margin-left: 6px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0;
      color: var(--muted);
    }
    .geo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
    }
    .geo svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .greeting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 20px;
      background: var(--surface);
      border-radius: var(--radius);
    }
    .greeting-sub {
      display: block;
      font-size: 13px;
      color: var(--muted);
    }
    .greeting-name {
      display: block;
      font-size: 15px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-link {
      flex-shrink: 0;
      min-height: 44px;
      padding: 0 4px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 3px;
      background: none;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .field { margin-bottom: 16px; }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }
    .input-wrap { position: relative; }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      font: inherit;
      font-size: 16px;
      color: var(--text);
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 150ms ease;
    }
    #pinInput { padding-right: 52px; }
    input::placeholder { color: var(--muted); }
    input[type="text"]:focus-visible,
    input[type="password"]:focus-visible {
      border-color: var(--ring);
      outline: 2px solid var(--ring);
      outline-offset: -1px;
    }

    .btn-eye {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      background: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: color 150ms ease;
    }
    .btn-eye svg { width: 20px; height: 20px; }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .remember input {
      width: 18px;
      height: 18px;
      accent-color: var(--text);
      cursor: pointer;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .btn {
      height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: transform 160ms var(--ease-out), background-color 150ms ease, opacity 150ms ease;
    }
    .btn-label,
    .btn-busy {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .btn .btn-busy { display: none; }
    .btn.is-busy .btn-label { display: none; }
    .btn.is-busy .btn-busy { display: inline-flex; }
    .btn-masuk { background: var(--masuk); color: var(--on-masuk); }
    .btn-pulang { background: var(--pulang); color: var(--on-pulang); }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { cursor: not-allowed; }
    .btn:disabled:not(.is-busy) { opacity: 0.4; }

    @media (hover: hover) and (pointer: fine) {
      .btn-masuk:hover:not(:disabled) { background: var(--masuk-hover); }
      .btn-pulang:hover:not(:disabled) { background: var(--pulang-hover); }
      .btn-eye:hover { color: var(--text); }
    }

    .btn:focus-visible,
    .btn-eye:focus-visible,
    .btn-link:focus-visible,
    .remember input:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }

    .spinner { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      display: none;
      align-items: flex-start;
      gap: 10px;
      margin-top: 16px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.5;
      border-radius: var(--radius);
    }
    .status.show { display: flex; }
    .status.enter { animation: status-in 200ms var(--ease-out); }
    @keyframes status-in {
      from { opacity: 0; transform: translateY(-4px); }
    }
    .status.info { background: var(--info-bg); color: var(--info-text); }
    .status.success { background: var(--ok-bg); color: var(--ok-text); }
    .status.error { background: var(--err-bg); color: var(--err-text); }
    .status-icon { width: 20px; height: 20px; flex-shrink: 0; }
    .status-icon:empty { display: none; }

    @media (min-width: 520px) {
      body { background: var(--surface); }
      .app { padding: 32px 16px; }
      .card {
        padding: 40px 36px 32px;
        border-radius: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: background-color 150ms ease, opacity 150ms ease; }
      .btn:active:not(:disabled) { transform: none; }
      .status.enter { animation: status-fade 200ms ease; }
      @keyframes status-fade { from { opacity: 0; } }
    }
  </style>
</head>

        <div id="userGreeting" class="greeting" hidden>
          <div>
            <span class="greeting-sub">Akun tersimpan</span>

            <label for="idInput">ID</label>
            <input
              id="idInput"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              placeholder="Masukkan ID"
              oninput="handleIdInput()"
            >
          </div>

          <div class="field">
            <label for="pinInput">PIN</label>
            <div class="input-wrap">
              <input
                id="pinInput"
                type="password"
                inputmode="numeric"
                autocomplete="current-password"
                placeholder="Masukkan PIN"
              >
              <button type="button" class="btn-eye" id="btnToggleEye" onclick="togglePinVisibility()" aria-label="Tampilkan PIN" aria-pressed="false">
                <svg id="eyeIconShow" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />

                <svg id="eyeIconHide" hidden fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">

                </svg>
              </button>
            </div>
          </div>

          <label class="remember" for="rememberMe">
            <input type="checkbox" id="rememberMe" onchange="handleRememberChange()">

  <script>
    const $ = (id) => document.getElementById(id);
    const RADIUS_M = 100; // ponytail: salinan manual dari RADIUS_M di Code.gs; samakan jika diubah

    // Jam & tanggal WIB, diselaraskan ke pergantian detik
    const fmtJam = new Intl.DateTimeFormat("id-ID", { timeZone: "Asia/Jakarta", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    const fmtTgl = new Intl.DateTimeFormat("id-ID", { timeZone: "Asia/Jakarta", weekday: "long", year: "numeric", month: "long", day: "numeric" });
    function tick() {
      const now = new Date();
      $("clockDisplay").textContent = fmtJam.format(now).replace(/:/g, ".");
      $("dateDisplay").textContent = fmtTgl.format(now);
      setTimeout(tick, 1000 - (Date.now() % 1000));
    }
    tick();

    // Simpan ID & nama di perangkat (PIN tidak pernah disimpan)
    const KEY_ID = "jonas_absensi_id";
    const KEY_NAMA = "jonas_absensi_nama";
    const KEY_REMEMBER = "jonas_absensi_remember";

    function showGreeting(nama) {
      $("greetingName").textContent = nama || "";
      $("userGreeting").hidden = !nama;
    }

    function loadSavedCredentials() {
      let savedId = null;
      try {
        // PIN versi lama pernah disimpan plaintext; hapus.
        localStorage.removeItem("jonas_absensi_pin");
        localStorage.removeItem("jonas_absensi_password");

        const remember = localStorage.getItem(KEY_REMEMBER) === "true";
        $("rememberMe").checked = remember;
        savedId = remember ? localStorage.getItem(KEY_ID) : null;
        if (savedId) {
          $("idInput").value = savedId;
          showGreeting(localStorage.getItem(KEY_NAMA));
        }
      } catch (e) {
        console.warn("Storage access not available:", e);
      }
      // Autofocus hanya di perangkat bermouse, supaya keyboard HP tidak langsung muncul
      if (window.matchMedia("(pointer: fine)").matches) {
        $(savedId ? "pinInput" : "idInput").focus();
      }
    }

    function saveCredentialsToDevice(id, nama) {
      try {
        if (!$("rememberMe").checked) return clearSavedCredentials();
        localStorage.setItem(KEY_REMEMBER, "true");
        if (id) localStorage.setItem(KEY_ID, id);
        if (nama) {
          localStorage.setItem(KEY_NAMA, nama);
          showGreeting(nama);
        }
      } catch (e) {
        console.warn("Storage save error:", e);
      }
    }

    function clearSavedCredentials() {
      try {
        localStorage.removeItem(KEY_ID);
        localStorage.removeItem(KEY_NAMA);
        localStorage.setItem(KEY_REMEMBER, "false");
      } catch (e) {}
      showGreeting(null);
    }

    function handleRememberChange() {
      if (!$("rememberMe").checked) return clearSavedCredentials();
      const id = $("idInput").value.trim();
      if (id) saveCredentialsToDevice(id, null);
    }

    function handleIdInput() {
      try {
        const savedId = localStorage.getItem(KEY_ID);
        if (!savedId) return;
        const sama = $("idInput").value.trim().toLowerCase() === savedId.toLowerCase();
        showGreeting(sama ? localStorage.getItem(KEY_NAMA) : null);
      } catch (e) {}
    }

    function switchAccount() {
      clearSavedCredentials();
      $("idInput").value = "";
      $("pinInput").value = "";
      $("idInput").focus();
    }

    function togglePinVisibility() {
      const input = $("pinInput");
      const btn = $("btnToggleEye");
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      btn.setAttribute("aria-pressed", String(show));
      btn.setAttribute("aria-label", show ? "Sembunyikan PIN" : "Tampilkan PIN");
      $("eyeIconShow").hidden = show;
      $("eyeIconHide").hidden = !show;
    }

    // Status
    const statusBox = $("statusBox");
    const statusIcon = $("statusIcon");
    const statusText = $("statusText");
    const btnMasuk = $("btnMasuk");
    const btnPulang = $("btnPulang");
    const ICONS = {
      success: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>',
      error: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>',
      info: ""
    };

    function showStatus(judul, pesan, tipe) {
      // Animasi hanya saat kotak status pertama muncul, bukan tiap pergantian pesan
      const baru = !statusBox.classList.contains("show");
      statusBox.className = "status show " + tipe + (baru ? " enter" : "");
      statusIcon.innerHTML = ICONS[tipe];
      statusText.textContent = "";
      if (judul) {
        const b = document.createElement("strong");
        b.textContent = judul + " ";
        statusText.appendChild(b);
      }
      statusText.appendChild(document.createTextNode(pesan));
    }

    function setBusy(btnAktif) {
      [btnMasuk, btnPulang].forEach(function (b) {
        b.disabled = !!btnAktif;
        b.classList.toggle("is-busy", b === btnAktif);
        b.setAttribute("aria-busy", String(b === btnAktif));
      });
    }

    // Enter = klik sintetis pada tombol submit pertama (Masuk); tidak bergantung pada e.submitter (Safari < 15.4)
    let aksiDipilih = "masuk";
    [btnMasuk, btnPulang].forEach(function (b) {
      b.addEventListener("click", function () { aksiDipilih = b.value; });
    });
    $("absenForm").addEventListener("submit", function (e) {
      e.preventDefault();
      lakukanAbsen(aksiDipilih);
    });

    function lakukanAbsen(aksi) {
      const idInput = $("idInput");
      const pinInput = $("pinInput");
      const idUser = idInput.value.trim();
      const pin = pinInput.value.trim();

      if (!idUser) {
        showStatus("ID belum diisi.", "Masukkan ID Anda.", "error");
        idInput.focus();
        return;
      }
      if (!pin) {
        showStatus("PIN belum diisi.", "Masukkan PIN absensi Anda.", "error");
        pinInput.focus();
        return;
      }
      if (!navigator.geolocation) {
        showStatus("GPS tidak didukung.", "Browser Anda tidak mendukung deteksi lokasi.", "error");
        return;
      }

      setBusy(aksi === "masuk" ? btnMasuk : btnPulang);
      showStatus("", "Mendeteksi lokasi Anda…", "info");

      navigator.geolocation.getCurrentPosition(
        function (pos) {
          const akurasi = Math.round(pos.coords.accuracy);
          showStatus("", "Memvalidasi identitas & radius kerja…", "info");

          google.script.run
            .withSuccessHandler(function (res) {
              const pesan = (res && typeof res === "object") ? res.message : res;
              const nama = (res && typeof res === "object") ? res.nama : null;
              showStatus("Berhasil!", pesan, "success");
              if (navigator.vibrate) navigator.vibrate(30);
              saveCredentialsToDevice(idUser, nama);
              pinInput.value = "";
              setBusy(null);
            })
            .withFailureHandler(function (err) {
              let pesan = err.message || "Terjadi kendala pada sistem.";
              // Laptop tanpa GPS menebak lokasi dari WiFi/IP; beri tahu bila akurasinya lebih kasar dari radius
              if (akurasi > RADIUS_M && /lokasi/i.test(pesan)) {
                pesan += " Akurasi lokasi perangkat ini hanya ±" + akurasi + " m, coba absen dari HP.";
              }
              showStatus("Gagal.", pesan, "error");
              setBusy(null);
            })
            .absen(idUser, pin, aksi, pos.coords.latitude, pos.coords.longitude);
        },
        function (err) {
          setBusy(null);
          let judul = "", pesan = "Gagal mendeteksi lokasi Anda.";
          if (err.code === 1) {
            judul = "Izin lokasi ditolak."; pesan = "Aktifkan izin lokasi di browser untuk melanjutkan absensi.";
          } else if (err.code === 2) {
            judul = "Lokasi tidak terdeteksi."; pesan = "Pastikan GPS atau WiFi perangkat aktif, lalu coba lagi.";
          } else if (err.code === 3) {
            judul = "Waktu habis."; pesan = "Pencarian lokasi terlalu lama. Silakan coba lagi.";
          }
          showStatus(judul, pesan, "error");
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    loadSavedCredentials();
  </script>
</body>
</html>
