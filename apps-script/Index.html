<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Presensi Jonas Photo</title>
  <base target="_top">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --color-primary: #2563eb;
      --color-primary-dark: #1d4ed8;
      --color-masuk: #059669;
      --color-masuk-hover: #047857;
      --color-pulang: #e11d48;
      --color-pulang-hover: #be123c;
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-text-main: #0f172a;
      --color-text-muted: #64748b;
      --color-border: #e2e8f0;
      --radius-card: 24px;
      --radius-element: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--color-bg);
      background-image:
        radial-gradient(at 10% 20%, rgba(37, 99, 235, 0.07) 0px, transparent 40%),
        radial-gradient(at 90% 80%, rgba(5, 150, 105, 0.07) 0px, transparent 40%),
        radial-gradient(at 50% 50%, rgba(225, 29, 72, 0.04) 0px, transparent 50%);
      color: var(--color-text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Decorative Glows */
    .ambient-glow-1,
    .ambient-glow-2 {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }
    .ambient-glow-1 {
      top: -80px;
      left: -80px;
      background: #38bdf8;
    }
    .ambient-glow-2 {
      bottom: -80px;
      right: -80px;
      background: #34d399;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--color-surface);
      width: 100%;
      max-width: 390px;
      padding: 32px 26px;
      border-radius: var(--radius-card);
      box-shadow:
        0 20px 40px -15px rgba(15, 23, 42, 0.08),
        0 0 0 1px rgba(226, 232, 240, 0.85);
      text-align: center;
      animation: cardEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEntrance {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Logo Header */
    
    .btn-admin-shortcut {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.2s;
      z-index: 10;
    }
    .btn-admin-shortcut:hover,
    .btn-admin-shortcut:active {
      background: #e2e8f0;
      color: #0f172a;
      transform: scale(1.05);
    }
    .btn-admin-shortcut svg {
      width: 16px;
      height: 16px;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 22px;
    }
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px 12px;
      margin-bottom: 8px;
      transition: transform 0.2s ease;
    }
    .logo-container:hover {
      transform: scale(1.02);
    }
    .logo-img {
      max-width: 185px;
      height: auto;
      display: block;
    }
    .badge-sub {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #64748b;
      background: #f1f5f9;
      padding: 4px 10px;
      border-radius: 999px;
      margin-top: 4px;
    }

    /* Clock & Date Widget */
    .time-widget {
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-element);
      padding: 16px 14px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .date-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .time-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .clock-display {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--color-text-main);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .tz-badge {
      background: #e0e7ff;
      color: #3730a3;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }

    /* Input Form Group */
    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: color 0.2s;
    }
    .input-wrapper:focus-within .input-icon {
      color: var(--color-primary);
    }
    input[type="password"],
    input[type="text"] {
      width: 100%;
      height: 48px;
      padding: 0 46px 0 42px;
      font-family: var(--font-main);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: normal;
      text-align: left;
      color: var(--color-text-main);
      background: #ffffff;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-element);
      outline: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    input[type="password"] {
      letter-spacing: 2px;
      font-size: 15px;
    }
    input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3.5px rgba(37, 99, 235, 0.12);
    }
    input::placeholder {
      color: #94a3b8;
      font-size: 13px;
      letter-spacing: normal;
      font-weight: 400;
    }
    .btn-toggle-eye {
      position: absolute;
      right: 10px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-toggle-eye:hover {
      color: var(--color-text-main);
      background: #f1f5f9;
    }
    .btn-toggle-eye svg {
      width: 18px;
      height: 18px;
    }

    /* User Greeting Banner */
    .user-greeting {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.06) 0%, rgba(16, 185, 129, 0.06) 100%);
      border: 1px solid rgba(191, 219, 254, 0.85);
      border-radius: var(--radius-element);
      text-align: left;
      animation: statusFade 0.3s ease-out forwards;
    }
    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 10px -2px rgba(37, 99, 235, 0.35);
    }
    .user-avatar svg {
      width: 18px;
      height: 18px;
    }
    .greeting-info {
      flex: 1;
      min-width: 0;
    }
    .greeting-sub {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
    }
    .greeting-name {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-switch-account {
      padding: 5px 11px;
      font-size: 11.5px;
      font-weight: 700;
      color: #2563eb;
      background: #ffffff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-switch-account:hover {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
    }

    /* Auto-Save Remember Row */
    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -6px;
      margin-bottom: 20px;
      padding: 0 2px;
    }
    .remember-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .remember-label input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .custom-checkbox {
      width: 18px;
      height: 18px;
      border: 1.5px solid #cbd5e1;
      border-radius: 5px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .remember-label input:checked + .custom-checkbox {
      background: var(--color-primary);
      border-color: var(--color-primary);
    }
    .custom-checkbox svg {
      width: 12px;
      height: 12px;
      color: #ffffff;
      stroke-width: 3;
      display: none;
    }
    .remember-label input:checked + .custom-checkbox svg {
      display: block;
    }
    .remember-text {
      font-size: 12.5px;
      font-weight: 600;
      color: #475569;
    }
    .saved-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 700;
      color: #059669;
      background: #ecfdf5;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #a7f3d0;
    }
    .saved-badge svg {
      width: 12px;
      height: 12px;
    }

    /* Action Buttons */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .btn-action {
      height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-main);
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      border: none;
      border-radius: var(--radius-element);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .btn-action svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .btn-masuk {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 8px 18px -4px rgba(16, 185, 129, 0.4);
    }
    .btn-masuk:hover:not(:disabled) {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      transform: translateY(-2px);
      box-shadow: 0 12px 22px -4px rgba(16, 185, 129, 0.48);
    }
    .btn-pulang {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      box-shadow: 0 8px 18px -4px rgba(244, 63, 94, 0.38);
    }
    .btn-pulang:hover:not(:disabled) {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
      transform: translateY(-2px);
      box-shadow: 0 12px 22px -4px rgba(244, 63, 94, 0.46);
    }
    .btn-action:active:not(:disabled) {
      transform: scale(0.97);
    }
    .btn-action:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Status Notification Box */
    .status-box {
      display: none;
      padding: 14px 16px;
      border-radius: var(--radius-element);
      font-size: 13px;
      line-height: 1.5;
      font-weight: 500;
      text-align: left;
      margin-bottom: 20px;
      animation: statusFade 0.3s ease-out forwards;
    }
    @keyframes statusFade {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .status-box.show {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .status-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .status-box.info {
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }
    .status-box.success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .status-box.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    /* Spinner Animation */
    .spinner {
      animation: rotate 1s linear infinite;
    }
    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    /* Location Verification Badge */
    .geo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      color: #475569;
    }
    .pulse-dot-wrapper {
      position: relative;
      width: 8px;
      height: 8px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
    }
    .pulse-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      opacity: 0.75;
      animation: pingRing 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes pingRing {
      75%, 100% {
        transform: scale(2.5);
        opacity: 0;
      }
    }
  </style>
</head>

        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />

    <!-- ID Input -->
    <div class="form-group">
      <label for="idInput">ID</label>
      <div class="input-wrapper">
        <span class="input-icon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </span>
        <input
          id="idInput"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Masukkan ID"
          oninput="handleIdInput()"

      </div>
    </div>

          <!-- Eye Slash Icon (hidden by default) -->
          <svg id="eyeIconHide" style="display:none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Auto-Save on Device Checkbox -->
    <div class="remember-row">
      <label class="remember-label" for="rememberMe">
        <input type="checkbox" id="rememberMe" checked onchange="handleRememberChange()">
        <span class="custom-checkbox">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
          </svg>
        </span>
        <span class="remember-text">Simpan otomatis di perangkat ini</span>
      </label>
      <span id="savedBadge" class="saved-badge" style="display:none;">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
        </svg>
        <span>Tersimpan</span>
      </span>
    </div>

    <!-- Action Buttons -->
    <div class="btn-grid">
      <button type="button" class="btn-action btn-masuk" id="btnMasuk" onclick="lakukanAbsen('masuk')">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
        </svg>
        <span>Masuk</span>
      </button>
      <button type="button" class="btn-action btn-pulang" id="btnPulang" onclick="lakukanAbsen('pulang')">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span>Pulang</span>
      </button>
    </div>

    <!-- Status Message Alert -->
    <div id="statusBox" class="status-box" role="alert">
      <div id="statusIcon" class="status-icon"></div>
      <div id="statusText"></div>
    </div>

    <!-- GPS Location Indicator -->
    <div class="geo-badge">
      <div class="pulse-dot-wrapper">
        <div class="pulse-ring"></div>
        <div class="pulse-dot"></div>
      </div>
      <span>Validasi Lokasi GPS Aktif (Radius 100m)</span>
    </div>
  </div>

  <script>
    // Realtime Clock & Indonesian Date
    function updateClock() {
      const now = new Date();
      const opsiJam = { timeZone: "Asia/Jakarta", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false };
      let jamStr = new Intl.DateTimeFormat("id-ID", opsiJam).format(now);
      jamStr = jamStr.replace(/:/g, '.');
      document.getElementById("clockDisplay").textContent = jamStr;

      const opsiTanggal = { timeZone: "Asia/Jakarta", weekday: "long", year: "numeric", month: "long", day: "numeric" };
      const tglStr = new Intl.DateTimeFormat("id-ID", opsiTanggal).format(now);
      document.getElementById("dateDisplay").textContent = tglStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Device LocalStorage Keys (Auto-Save Perangkat)
    const KEY_ID = "jonas_absensi_id";
    const KEY_PIN = "jonas_absensi_pin";
    const KEY_PASS_OLD = "jonas_absensi_password";
    const KEY_NAMA = "jonas_absensi_nama";
    const KEY_REMEMBER = "jonas_absensi_remember";

    // Muat data akun tersimpan saat halaman dibuka
    function loadSavedCredentials() {
      try {
        const remember = localStorage.getItem(KEY_REMEMBER) !== "false";
        const chk = document.getElementById("rememberMe");
        if (chk) chk.checked = remember;

        const savedId = localStorage.getItem(KEY_ID);
        const savedPin = localStorage.getItem(KEY_PIN) || localStorage.getItem(KEY_PASS_OLD);
        const savedNama = localStorage.getItem(KEY_NAMA);

        if (remember && savedId) {
          const idInput = document.getElementById("idInput");
          const pinInput = document.getElementById("pinInput");
          if (idInput) idInput.value = savedId;
          if (pinInput && savedPin) pinInput.value = savedPin;

          const savedBadge = document.getElementById("savedBadge");
          if (savedBadge) savedBadge.style.display = "inline-flex";

          if (savedNama) {
            const greetingEl = document.getElementById("greetingName");
            const greetingBox = document.getElementById("userGreeting");
            if (greetingEl) greetingEl.textContent = savedNama;
            if (greetingBox) greetingBox.style.display = "flex";
          }
        }
      } catch (e) {
        console.warn("Storage access not available:", e);
      }
    }

    // Simpan data login ke localStorage perangkat
    function saveCredentialsToDevice(id, pin, nama) {
      try {
        const remember = document.getElementById("rememberMe").checked;
        if (remember) {
          localStorage.setItem(KEY_REMEMBER, "true");
          if (id) localStorage.setItem(KEY_ID, id);
          if (pin) localStorage.setItem(KEY_PIN, pin);
          if (nama) {
            localStorage.setItem(KEY_NAMA, nama);
            const greetingEl = document.getElementById("greetingName");
            const greetingBox = document.getElementById("userGreeting");
            if (greetingEl) greetingEl.textContent = nama;
            if (greetingBox) greetingBox.style.display = "flex";
          }
          const savedBadge = document.getElementById("savedBadge");
          if (savedBadge) savedBadge.style.display = "inline-flex";
        } else {
          clearSavedCredentials();
        }
      } catch (e) {
        console.warn("Storage save error:", e);
      }
    }

    // Hapus data login tersimpan dari perangkat
    function clearSavedCredentials() {
      try {
        localStorage.removeItem(KEY_ID);
        localStorage.removeItem(KEY_PIN);
        localStorage.removeItem(KEY_PASS_OLD);
        localStorage.removeItem(KEY_NAMA);
        localStorage.setItem(KEY_REMEMBER, "false");
        const savedBadge = document.getElementById("savedBadge");
        const greetingBox = document.getElementById("userGreeting");
        if (savedBadge) savedBadge.style.display = "none";
        if (greetingBox) greetingBox.style.display = "none";
      } catch (e) {}
    }

    // Event saat checkbox "Simpan di perangkat" diubah
    function handleRememberChange() {
      const remember = document.getElementById("rememberMe").checked;
      if (!remember) {
        clearSavedCredentials();
      } else {
        const id = document.getElementById("idInput").value.trim();
        const pin = document.getElementById("pinInput").value.trim();
        if (id && pin) {
          saveCredentialsToDevice(id, pin, null);
        }
      }
    }

    // Event saat user mengetik ID berbeda
    function handleIdInput() {
      const savedId = localStorage.getItem(KEY_ID);
      const curId = document.getElementById("idInput").value.trim();
      const greetingBox = document.getElementById("userGreeting");
      const savedBadge = document.getElementById("savedBadge");
      if (savedId && curId.toLowerCase() !== savedId.toLowerCase()) {
        if (greetingBox) greetingBox.style.display = "none";
        if (savedBadge) savedBadge.style.display = "none";
      } else if (savedId && curId.toLowerCase() === savedId.toLowerCase()) {
        const savedNama = localStorage.getItem(KEY_NAMA);
        if (savedNama && greetingBox) greetingBox.style.display = "flex";
        if (savedBadge) savedBadge.style.display = "inline-flex";
      }
    }

    // Tombol Ganti Akun
    function switchAccount() {
      clearSavedCredentials();
      document.getElementById("idInput").value = "";
      document.getElementById("pinInput").value = "";
      document.getElementById("rememberMe").checked = true;
      document.getElementById("idInput").focus();
    }

    // PIN Visibility Toggle
    function togglePinVisibility() {
      const input = document.getElementById("pinInput");
      const iconShow = document.getElementById("eyeIconShow");
      const iconHide = document.getElementById("eyeIconHide");
      if (input.type === "password") {
        input.type = "text";
        iconShow.style.display = "none";
        iconHide.style.display = "block";
      } else {
        input.type = "password";
        iconShow.style.display = "block";
        iconHide.style.display = "none";
      }
    }

    // Status Alert Helper
    const statusBox = document.getElementById("statusBox");
    const statusIcon = document.getElementById("statusIcon");
    const statusText = document.getElementById("statusText");
    const btnMasuk = document.getElementById("btnMasuk");
    const btnPulang = document.getElementById("btnPulang");

    function showStatus(pesan, tipe) {
      statusBox.className = "status-box show " + tipe;
      statusText.innerHTML = pesan;

      if (tipe === "info") {
        statusIcon.innerHTML = '<svg class="spinner" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="3" stroke-dasharray="30 60" stroke-linecap="round" /></svg>';
      } else if (tipe === "success") {
        statusIcon.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
      } else if (tipe === "error") {
        statusIcon.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
      }
    }

    function setButtonsBusy(isBusy) {
      btnMasuk.disabled = isBusy;
      btnPulang.disabled = isBusy;
    }

    // Absen Submission dengan ID, PIN, dan GPS Validation
    function lakukanAbsen(aksi) {
      const idInput = document.getElementById("idInput");
      const pinInput = document.getElementById("pinInput");
      const idUser = idInput.value.trim();
      const pin = pinInput.value.trim();

      if (!idUser) {
        showStatus("<strong>ID Belum Diisi:</strong> Masukkan ID Anda.", "error");
        idInput.focus();
        return;
      }

      if (!pin) {
        showStatus("<strong>PIN Belum Diisi:</strong> Masukkan PIN absensi Anda.", "error");
        pinInput.focus();
        return;
      }

      if (!navigator.geolocation) {
        showStatus("<strong>GPS Tidak Didukung:</strong> Browser Anda tidak mendukung deteksi lokasi.", "error");
        return;
      }

      setButtonsBusy(true);
      showStatus("Menghubungkan ke satelit GPS & memindai lokasi Anda...", "info");

      navigator.geolocation.getCurrentPosition(
        function (pos) {
          showStatus("Memvalidasi identitas & radius kerja...", "info");

          google.script.run
            .withSuccessHandler(function (res) {
              const pesan = (res && typeof res === 'object') ? res.message : res;
              const nama = (res && typeof res === 'object') ? res.nama : null;
              showStatus("<strong>Berhasil!</strong> " + pesan, "success");

              // Simpan otomatis ke perangkat jika opsi aktif
              saveCredentialsToDevice(idUser, pin, nama);

              setButtonsBusy(false);
            })
            .withFailureHandler(function (err) {
              showStatus("<strong>Gagal:</strong> " + (err.message || "Terjadi kendala pada sistem."), "error");
              setButtonsBusy(false);
            })
            .absen(idUser, pin, aksi, pos.coords.latitude, pos.coords.longitude);
        },
        function (err) {
          setButtonsBusy(false);
          let pesan = "Gagal mendeteksi lokasi GPS Anda.";
          if (err.code === 1) {
            pesan = "<strong>Izin Lokasi Ditolak:</strong> Silakan aktifkan izin lokasi di browser Anda untuk melanjutkan absensi.";
          } else if (err.code === 2) {
            pesan = "<strong>Sinyal GPS Lemah:</strong> Pastikan GPS pada perangkat Anda aktif dan memiliki sinyal yang memadai.";
          } else if (err.code === 3) {
            pesan = "<strong>Waktu Habis:</strong> Pencarian sinyal GPS membutuhkan waktu terlalu lama. Silakan coba lagi.";
          }
          showStatus(pesan, "error");
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    // Navigasi ke Portal Admin & Data (menembus sandbox iframe Google Apps Script)
    const SCRIPT_BASE_URL = '<?= scriptUrl ?>';

    function navigateToAdmin(e) {
      if (e) {
        try { e.preventDefault(); } catch (err) {}
      }
      const dest = (SCRIPT_BASE_URL || 'https://script.google.com/macros/s/AKfycbzfkm8mu2pZcUAvU1MugpaLGejwK-HL2mEsKma-hPPSwW3SgH7QmG6YfgXhzBKlsOPBYQ/exec') + '?page=admin';
      try {
        if (window.top) {
          window.top.location.href = dest;
          return;
        }
      } catch (err) {}
      window.location.href = dest;
    }

    // Jalankan auto-load saat halaman siap
    loadSavedCredentials();
  </script>
</body>
</html>
