<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Aplikasi Presensi Mobile Jonas Photo - Jl. Progo No. 12, Bandung">
  <title>Presensi Jonas Photo - Mobile</title>
  <base target="_top">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --color-primary: #2563eb;
      --color-primary-dark: #1d4ed8;
      --color-primary-glow: rgba(37, 99, 235, 0.25);
      --color-masuk: #10b981;
      --color-masuk-dark: #059669;
      --color-masuk-glow: rgba(16, 185, 129, 0.35);
      --color-pulang: #f43f5e;
      --color-pulang-dark: #e11d48;
      --color-pulang-glow: rgba(244, 63, 94, 0.35);
      --color-bg-viewport: #0b1329;
      --color-app-bg: #f8fafc;
      --color-card-surface: #ffffff;
      --color-text-main: #0f172a;
      --color-text-muted: #64748b;
      --color-border: #e2e8f0;
      --radius-device: 44px;
      --radius-card: 22px;
      --radius-element: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--color-bg-viewport);
      background-image:
        radial-gradient(at 15% 20%, rgba(37, 99, 235, 0.25) 0px, transparent 50%),
        radial-gradient(at 85% 85%, rgba(16, 185, 129, 0.2) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(244, 63, 94, 0.15) 0px, transparent 60%);
      color: var(--color-text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 0;
      overflow-x: hidden;
      font-size: 14px;
      line-height: 1.5;
    }

    /* Ambient Lighting Effect (Visible on Desktop / Tablet) */
    .ambient-glow {
      position: fixed;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }
    .glow-top {
      top: -120px;
      left: 10%;
      background: #38bdf8;
    }
    .glow-bottom {
      bottom: -120px;
      right: 10%;
      background: #34d399;
    }

    /* Smartphone Device Shell */
    .smartphone-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      min-height: 100dvh;
      background: var(--color-app-bg);
      display: flex;
      flex-direction: column;
      box-shadow:
        0 25px 70px -15px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.15);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      transition: all 0.3s ease;
    }

    /* Responsive Adaptation for Desktop Browser: Elegant Handset Frame */
    @media (min-width: 481px) {
      body {
        padding: 24px 16px;
      }
      .smartphone-shell {
        min-height: 844px;
        height: auto;
        border-radius: var(--radius-device);
        border: 10px solid #1e293b;
        box-shadow:
          0 35px 80px -20px rgba(0, 0, 0, 0.65),
          0 0 0 2px rgba(255, 255, 255, 0.1),
          0 0 0 12px #0f172a;
      }
    }

    /* Smartphone Top Bar / Status Bar */
    .phone-status-bar {
      padding: max(10px, env(safe-area-inset-top)) 20px 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border-bottom: 1px solid rgba(226, 232, 240, 0.6);
      user-select: none;
    }
    .status-left {
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dynamic-island {
      width: 86px;
      height: 18px;
      background: #0f172a;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.1);
    }
    .camera-lens {
      width: 7px;
      height: 7px;
      background: #1e293b;
      border-radius: 50%;
      border: 1px solid #334155;
    }
    .sensor-slit {
      width: 22px;
      height: 3px;
      background: #1e293b;
      border-radius: 4px;
    }
    .status-right {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #0f172a;
    }
    .status-icon {
      width: 14px;
      height: 14px;
    }

    /* Mobile Header & Brand Bar */
    .mobile-header {
      padding: 16px 20px 14px 20px;
      background: #ffffff;
      text-align: center;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .logo-badge {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 2px 8px;
      margin-bottom: 6px;
    }
    .logo-img {
      max-width: 168px;
      height: auto;
      aspect-ratio: 185 / 40;
      display: block;
    }
    .app-tagline {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #475569;
      background: #f1f5f9;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid #e2e8f0;
    }
    .btn-admin-shortcut {
      position: absolute;
      top: 14px;
      right: 16px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-admin-shortcut:hover,
    .btn-admin-shortcut:active {
      background: #e2e8f0;
      color: #0f172a;
      transform: scale(1.05);
    }
    .btn-admin-shortcut svg {
      width: 17px;
      height: 17px;
    }

    /* Main Scrollable Content Container */
    .mobile-content {
      flex: 1;
      padding: 18px 18px max(24px, env(safe-area-inset-bottom)) 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Hero Clock & Date Card */
    .clock-hero-card {
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      border-radius: var(--radius-card);
      padding: 20px 18px;
      color: #ffffff;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 14px 28px -8px rgba(15, 23, 42, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .clock-hero-card::before {
      content: "";
      position: absolute;
      top: -40px;
      right: -40px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .clock-hero-card::after {
      content: "";
      position: absolute;
      bottom: -30px;
      left: -30px;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 700;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }
    .date-pill svg {
      width: 13px;
      height: 13px;
      color: #38bdf8;
    }
    .clock-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .clock-digits {
      font-size: clamp(2.2rem, 1.8rem + 2vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
      text-shadow: 0 0 24px rgba(56, 189, 248, 0.35);
      line-height: 1.1;
    }
    .tz-tag {
      background: #38bdf8;
      color: #0c4a6e;
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    /* Radar Geo Location Pill */
    .geo-radar-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 5px 12px;
      border-radius: 999px;
    }
    .radar-pulse-box {
      position: relative;
      width: 8px;
      height: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .radar-core {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
    }
    .radar-ping {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      opacity: 0.8;
      animation: radarPing 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes radarPing {
      70%, 100% {
        transform: scale(2.8);
        opacity: 0;
      }
    }

    /* User Profile Card (When remembered) */
    .user-profile-card {
      display: none;
      background: #ffffff;
      border: 1.5px solid #bfdbfe;
      border-radius: var(--radius-element);
      padding: 14px 16px;
      box-shadow: 0 4px 12px -2px rgba(37, 99, 235, 0.08);
      animation: cardSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes cardSlideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .profile-card-inner {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-avatar-badge {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 6px 14px -3px rgba(37, 99, 235, 0.4);
    }
    .user-avatar-badge svg {
      width: 22px;
      height: 22px;
    }
    .user-meta {
      flex: 1;
      min-width: 0;
    }
    .user-greeting-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 1px;
    }
    .user-name-title {
      font-size: 14.5px;
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10.5px;
      font-weight: 700;
      color: #059669;
      margin-top: 2px;
    }
    .user-verified-badge svg {
      width: 12px;
      height: 12px;
    }
    .btn-switch-user {
      padding: 6px 12px;
      font-size: 11.5px;
      font-weight: 700;
      color: #2563eb;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.2s;
    }
    .btn-switch-user:active {
      transform: scale(0.95);
      background: #dbeafe;
    }

    /* Form Card Container */
    .form-card {
      background: #ffffff;
      border-radius: var(--radius-card);
      border: 1px solid var(--color-border);
      padding: 18px 16px;
      box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      text-align: left;
    }
    .input-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }
    .label-hint {
      font-size: 11px;
      font-weight: 500;
      color: #94a3b8;
    }
    .input-container {
      position: relative;
      display: flex;
      align-items: center;
    }
    .field-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: color 0.2s;
    }
    .input-container:focus-within .field-icon {
      color: var(--color-primary);
    }

    .app-input {
      width: 100%;
      height: 52px;
      padding: 0 48px 0 44px;
      font-family: var(--font-main);
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text-main);
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: var(--radius-element);
      outline: none;
      touch-action: manipulation;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .app-input:focus {
      background: #ffffff;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }
    .app-input::placeholder {
      color: #94a3b8;
      font-size: 13.5px;
      font-weight: 400;
    }
    .input-pin {
      letter-spacing: 3px;
      font-size: 16px;
    }

    .btn-eye-toggle {
      position: absolute;
      right: 10px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 10px;
      color: #94a3b8;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.2s;
    }
    .btn-eye-toggle:active {
      transform: scale(0.92);
      background: #e2e8f0;
      color: var(--color-text-main);
    }
    .btn-eye-toggle svg {
      width: 20px;
      height: 20px;
    }

    /* iOS-Style Toggle Switch for Remember Device */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 4px 4px;
      border-top: 1px dashed #e2e8f0;
      margin-top: 4px;
    }
    .switch-label-group {
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .switch-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #1e293b;
    }
    .switch-subtitle {
      font-size: 11px;
      color: #64748b;
    }
    .ios-switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 26px;
      flex-shrink: 0;
    }
    .ios-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #cbd5e1;
      transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 999px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }
    .ios-switch input:checked + .slider {
      background-color: var(--color-primary);
    }
    .ios-switch input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Action Punch Buttons (Thumb Friendly) */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 4px;
    }
    .btn-punch {
      min-height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: none;
      border-radius: var(--radius-element);
      color: #ffffff;
      cursor: pointer;
      position: relative;
      touch-action: manipulation;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      overflow: hidden;
    }
    .btn-punch-icon-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-punch-icon-row svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.5;
    }
    .btn-punch-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .btn-punch-sub {
      font-size: 10.5px;
      font-weight: 600;
      opacity: 0.9;
    }

    .btn-masuk {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 10px 22px -6px var(--color-masuk-glow);
    }
    .btn-masuk:active:not(:disabled) {
      transform: scale(0.96);
      filter: brightness(0.92);
    }

    .btn-pulang {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      box-shadow: 0 10px 22px -6px var(--color-pulang-glow);
    }
    .btn-pulang:active:not(:disabled) {
      transform: scale(0.96);
      filter: brightness(0.92);
    }

    .btn-punch:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Live Notification Toast / Bottom Sheet */
    .status-toast {
      display: none;
      padding: 14px 16px;
      border-radius: var(--radius-element);
      font-size: 13px;
      line-height: 1.45;
      font-weight: 600;
      text-align: left;
      box-shadow: 0 8px 24px -6px rgba(15, 23, 42, 0.12);
      animation: toastRise 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes toastRise {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .status-toast.show {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .toast-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .toast-text {
      flex: 1;
    }
    .status-toast.info {
      background: #eff6ff;
      color: #1e40af;
      border: 1.5px solid #bfdbfe;
    }
    .status-toast.success {
      background: #ecfdf5;
      color: #065f46;
      border: 1.5px solid #a7f3d0;
    }
    .status-toast.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1.5px solid #fecaca;
    }

    /* Spinner Animation */
    .spinner-svg {
      animation: spinRound 1s linear infinite;
    }
    @keyframes spinRound {
      100% { transform: rotate(360deg); }
    }

    /* Office Location Info Card */
    .office-info-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-element);
      font-size: 11.5px;
      font-weight: 600;
      color: #475569;
    }
    .office-info-pill svg {
      width: 15px;
      height: 15px;
      color: #ef4444;
      flex-shrink: 0;
    }

    /* Mobile Home Indicator Bar */
    .phone-bottom-bar {
      padding: 10px 0 max(8px, env(safe-area-inset-bottom)) 0;
      display: flex;
      justify-content: center;
      background: var(--color-app-bg);
      user-select: none;
    }
    .home-indicator-pill {
      width: 134px;
      height: 5px;
      background: #cbd5e1;
      border-radius: 999px;
      transition: background 0.2s;
    }
  </style>
</head>
<body>
  <!-- Ambient Backlight Effects -->
  <div class="ambient-glow glow-top"></div>
  <div class="ambient-glow glow-bottom"></div>

  <!-- Smartphone Mobile App Shell -->
  <main class="smartphone-shell" role="main">

    <!-- Top Status Bar (Phone Notch & Icons) -->
    <header class="phone-status-bar" aria-label="Status Bar">
      <div class="status-left">
        <span id="phoneClock">--.--</span>
        <span>WIB</span>
      </div>
      <div class="dynamic-island" aria-hidden="true">
        <div class="camera-lens"></div>
        <div class="sensor-slit"></div>
      </div>
      <div class="status-right" aria-label="Konektivitas">
        <!-- 5G / Cellular SVG -->
        <svg class="status-icon" fill="currentColor" viewBox="0 0 24 24">
          <path d="M2 17h3v4H2v-4zm5-4h3v8H7v-8zm5-4h3v12h-3V9zm5-4h3v16h-3V5z" />
        </svg>
        <!-- Battery SVG -->
        <svg class="status-icon" fill="currentColor" viewBox="0 0 24 24">

    <!-- Scrollable Content Section -->
    <div class="mobile-content">

      <!-- Realtime Hero Clock Card -->
      <section class="clock-hero-card" aria-label="Waktu Presensi">
        <div class="date-pill" id="dateDisplay">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />

        <div class="clock-row">
          <div class="clock-digits" id="clockDisplay">--.--.--</div>
          <span class="tz-tag">WIB</span>
        </div>
        <div>
          <div class="geo-radar-pill">
            <div class="radar-pulse-box">
              <div class="radar-ping"></div>
              <div class="radar-core"></div>
            </div>
            <span>Radius GPS 100m Aktif (Progo 12)</span>
          </div>
        </div>
      </section>

      <!-- Active User Card (Tampil jika sudah tersimpan di perangkat) -->
      <section id="userGreeting" class="user-profile-card">
        <div class="profile-card-inner">
          <div class="user-avatar-badge">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </div>
          <div class="user-meta">
            <div class="user-greeting-label">Akun Tersimpan di HP Ini</div>

              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
              </svg>
              <span>Perangkat Terverifikasi</span>
            </div>
          </div>
          <button type="button" class="btn-switch-user" onclick="switchAccount()" title="Ganti ke akun lain">
            Ganti
          </button>
        </div>
      </section>

      <!-- Input Form Card -->
      <section class="form-card" aria-label="Formulir Kredensial">
        <!-- ID Input -->
        <div class="form-group">
          <label class="input-label" for="idInput">
            <span>ID Pengguna</span>
            <span class="label-hint">Nama atau @ID</span>
          </label>
          <div class="input-container">
            <span class="field-icon">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </span>
            <input
              id="idInput"
              class="app-input"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              placeholder="Masukkan ID Anda"
              oninput="handleIdInput()"
            >
          </div>
        </div>

        <!-- PIN Input -->
        <div class="form-group">
          <label class="input-label" for="pinInput">
            <span>PIN Absensi</span>
            <span class="label-hint">Angka PIN</span>
          </label>
          <div class="input-container">
            <span class="field-icon">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input
              id="pinInput"
              class="app-input input-pin"
              type="password"
              inputmode="numeric"
              pattern="[0-9]*"
              autocomplete="current-password"
              placeholder="Masukkan PIN"
            >
            <button
              type="button"
              class="btn-eye-toggle"
              id="btnToggleEye"
              onclick="togglePinVisibility()"
              aria-label="Lihat atau sembunyikan PIN"
            >
              <!-- Eye Show -->
              <svg id="eyeIconShow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>

              <svg id="eyeIconHide" style="display:none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Toggle Switch Remember Device -->
        <div class="switch-row">
          <div class="switch-label-group">
            <span class="switch-title">Simpan Akun di HP Ini</span>
            <span class="switch-subtitle">Tidak perlu ketik ulang setiap hari</span>
          </div>
          <label class="ios-switch" for="rememberMe">
            <input type="checkbox" id="rememberMe" checked onchange="handleRememberChange()">
            <span class="slider"></span>
          </label>
        </div>

      <!-- Action Punch Buttons (Masuk & Pulang) -->
      <section class="action-grid" aria-label="Tombol Aksi Presensi">
        <button
          type="button"
          class="btn-punch btn-masuk"
          id="btnMasuk"
          onclick="lakukanAbsen('masuk')"
        >
          <div class="btn-punch-icon-row">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
            </svg>
            <span class="btn-punch-title">MASUK</span>
          </div>
          <span class="btn-punch-sub">Mulai Jam Kerja</span>
        </button>

        <button
          type="button"
          class="btn-punch btn-pulang"
          id="btnPulang"
          onclick="lakukanAbsen('pulang')"
        >
          <div class="btn-punch-icon-row">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            <span class="btn-punch-title">PULANG</span>
          </div>
          <span class="btn-punch-sub">Selesai Jam Kerja</span>
        </button>
      </section>

      <!-- Live Toast Notification Banner -->
      <div id="statusBox" class="status-toast" role="alert" aria-live="assertive">
        <div id="statusIcon" class="toast-icon"></div>
        <div id="statusText" class="toast-text"></div>
      </div>

      <!-- Office Location Footnote -->
      <div class="office-info-pill">
        <svg fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
        </svg>
        <span>Jonas Photo • Jl. Progo No. 12, Bandung</span>
      </div>

    </div>

    <!-- Phone Bottom Navigation / Safe Area Home Indicator -->
    <footer class="phone-bottom-bar" aria-hidden="true">
      <div class="home-indicator-pill"></div>
    </footer>

  </main>

  <script>
    // Realtime Clock & Indonesian Date
    function updateClock() {
      const now = new Date();
      const opsiJam = { timeZone: "Asia/Jakarta", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false };
      let jamStr = new Intl.DateTimeFormat("id-ID", opsiJam).format(now);
      jamStr = jamStr.replace(/:/g, '.');

      const clockEl = document.getElementById("clockDisplay");
      if (clockEl) clockEl.textContent = jamStr;

      // Update phone status bar clock (without seconds)
      const phoneClockEl = document.getElementById("phoneClock");
      if (phoneClockEl) {
        const jamPendek = jamStr.substring(0, 5);
        phoneClockEl.textContent = jamPendek;
      }

      const opsiTanggal = { timeZone: "Asia/Jakarta", weekday: "long", year: "numeric", month: "long", day: "numeric" };
      const tglStr = new Intl.DateTimeFormat("id-ID", opsiTanggal).format(now);
      const dateTextEl = document.getElementById("dateText");
      if (dateTextEl) dateTextEl.textContent = tglStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Device LocalStorage Keys (Auto-Save Perangkat)
    const KEY_ID = "jonas_absensi_id";
    const KEY_PIN = "jonas_absensi_pin";
    const KEY_PASS_OLD = "jonas_absensi_password";
    const KEY_NAMA = "jonas_absensi_nama";
    const KEY_REMEMBER = "jonas_absensi_remember";

    // Muat data akun tersimpan saat halaman dibuka
    function loadSavedCredentials() {
      try {
        const remember = localStorage.getItem(KEY_REMEMBER) !== "false";
        const chk = document.getElementById("rememberMe");
        if (chk) chk.checked = remember;

        const savedId = localStorage.getItem(KEY_ID);
        const savedPin = localStorage.getItem(KEY_PIN) || localStorage.getItem(KEY_PASS_OLD);
        const savedNama = localStorage.getItem(KEY_NAMA);

        if (remember && savedId) {
          const idInput = document.getElementById("idInput");
          const pinInput = document.getElementById("pinInput");
          if (idInput) idInput.value = savedId;
          if (pinInput && savedPin) pinInput.value = savedPin;

          if (savedNama) {
            const greetingEl = document.getElementById("greetingName");
            const greetingBox = document.getElementById("userGreeting");
            if (greetingEl) greetingEl.textContent = savedNama;
            if (greetingBox) greetingBox.style.display = "block";
          }
        }
      } catch (e) {
        console.warn("Storage access not available:", e);
      }
    }

    // Simpan data login ke localStorage perangkat
    function saveCredentialsToDevice(id, pin, nama) {
      try {
        const remember = document.getElementById("rememberMe").checked;
        if (remember) {
          localStorage.setItem(KEY_REMEMBER, "true");
          if (id) localStorage.setItem(KEY_ID, id);
          if (pin) localStorage.setItem(KEY_PIN, pin);
          if (nama) {
            localStorage.setItem(KEY_NAMA, nama);
            const greetingEl = document.getElementById("greetingName");
            const greetingBox = document.getElementById("userGreeting");
            if (greetingEl) greetingEl.textContent = nama;
            if (greetingBox) greetingBox.style.display = "block";
          }
        } else {
          clearSavedCredentials();
        }
      } catch (e) {
        console.warn("Storage save error:", e);
      }
    }

    // Hapus data login tersimpan dari perangkat
    function clearSavedCredentials() {
      try {
        localStorage.removeItem(KEY_ID);
        localStorage.removeItem(KEY_PIN);
        localStorage.removeItem(KEY_PASS_OLD);
        localStorage.removeItem(KEY_NAMA);
        localStorage.setItem(KEY_REMEMBER, "false");
        const greetingBox = document.getElementById("userGreeting");
        if (greetingBox) greetingBox.style.display = "none";
      } catch (e) {}
    }

    // Event saat toggle "Simpan di HP Ini" diubah
    function handleRememberChange() {
      const remember = document.getElementById("rememberMe").checked;
      if (!remember) {
        clearSavedCredentials();
      } else {
        const id = document.getElementById("idInput").value.trim();
        const pin = document.getElementById("pinInput").value.trim();
        if (id && pin) {
          saveCredentialsToDevice(id, pin, null);
        }
      }
    }

    // Event saat pengguna mengetik ID
    function handleIdInput() {
      const savedId = localStorage.getItem(KEY_ID);
      const curId = document.getElementById("idInput").value.trim();
      const greetingBox = document.getElementById("userGreeting");
      if (savedId && curId.toLowerCase() !== savedId.toLowerCase()) {
        if (greetingBox) greetingBox.style.display = "none";
      } else if (savedId && curId.toLowerCase() === savedId.toLowerCase()) {
        const savedNama = localStorage.getItem(KEY_NAMA);
        if (savedNama && greetingBox) greetingBox.style.display = "block";
      }
    }

    // Tombol Ganti Akun
    function switchAccount() {
      clearSavedCredentials();
      document.getElementById("idInput").value = "";
      document.getElementById("pinInput").value = "";
      document.getElementById("rememberMe").checked = true;
      document.getElementById("idInput").focus();
    }

    // PIN Visibility Toggle
    function togglePinVisibility() {
      const input = document.getElementById("pinInput");
      const iconShow = document.getElementById("eyeIconShow");
      const iconHide = document.getElementById("eyeIconHide");
      if (input.type === "password") {
        input.type = "text";
        iconShow.style.display = "none";
        iconHide.style.display = "block";
      } else {
        input.type = "password";
        iconShow.style.display = "block";
        iconHide.style.display = "none";
      }
    }

    // Status Notification Toast Helper
    const statusBox = document.getElementById("statusBox");
    const statusIcon = document.getElementById("statusIcon");
    const statusText = document.getElementById("statusText");
    const btnMasuk = document.getElementById("btnMasuk");
    const btnPulang = document.getElementById("btnPulang");

    function showStatus(pesan, tipe) {
      statusBox.className = "status-toast show " + tipe;
      statusText.innerHTML = pesan;

      if (tipe === "info") {
        statusIcon.innerHTML = '<svg class="spinner-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="3" stroke-dasharray="30 60" stroke-linecap="round" /></svg>';
      } else if (tipe === "success") {
        statusIcon.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
      } else if (tipe === "error") {
        statusIcon.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
      }

      // Auto-scroll smooth to status toast if needed
      statusBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function setButtonsBusy(isBusy) {
      btnMasuk.disabled = isBusy;
      btnPulang.disabled = isBusy;
    }

    // Absen Submission dengan ID, PIN, dan Validasi GPS Radius 100m
    function lakukanAbsen(aksi) {
      const idInput = document.getElementById("idInput");
      const pinInput = document.getElementById("pinInput");
      const idUser = idInput.value.trim();
      const pin = pinInput.value.trim();

      if (!idUser) {
        showStatus("<strong>ID Belum Diisi:</strong> Masukkan ID Anda.", "error");
        idInput.focus();
        return;
      }

      if (!pin) {
        showStatus("<strong>PIN Belum Diisi:</strong> Masukkan PIN absensi Anda.", "error");
        pinInput.focus();
        return;
      }

      if (!navigator.geolocation) {
        showStatus("<strong>GPS Tidak Didukung:</strong> Perangkat atau browser Anda tidak mendukung deteksi lokasi.", "error");
        return;
      }

      setButtonsBusy(true);
      showStatus("Menghubungkan ke satelit GPS & memindai radius lokasi...", "info");

      navigator.geolocation.getCurrentPosition(
        function (pos) {
          showStatus("Memvalidasi identitas & radius kerja di Jl. Progo 12...", "info");

          google.script.run
            .withSuccessHandler(function (res) {
              const pesan = (res && typeof res === 'object') ? res.message : res;
              const nama = (res && typeof res === 'object') ? res.nama : null;
              showStatus("<strong>Berhasil!</strong> " + pesan, "success");

              // Simpan otomatis ke perangkat jika opsi aktif
              saveCredentialsToDevice(idUser, pin, nama);

              setButtonsBusy(false);
            })
            .withFailureHandler(function (err) {
              showStatus("<strong>Gagal:</strong> " + (err.message || "Terjadi kendala pada sistem."), "error");
              setButtonsBusy(false);
            })
            .absen(idUser, pin, aksi, pos.coords.latitude, pos.coords.longitude);
        },
        function (err) {
          setButtonsBusy(false);
          let pesan = "Gagal mendeteksi lokasi GPS Anda.";
          if (err.code === 1) {
            pesan = "<strong>Izin Lokasi Ditolak:</strong> Silakan aktifkan izin lokasi di browser HP Anda untuk melanjutkan absensi.";
          } else if (err.code === 2) {
            pesan = "<strong>Sinyal GPS Lemah:</strong> Pastikan GPS pada HP Anda aktif dan memiliki sinyal yang memadai.";
          } else if (err.code === 3) {
            pesan = "<strong>Waktu Habis:</strong> Pencarian sinyal GPS membutuhkan waktu terlalu lama. Silakan coba lagi.";
          }
          showStatus(pesan, "error");
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    // Jalankan auto-load saat halaman siap
    loadSavedCredentials();
  </script>
</body>
</html>
